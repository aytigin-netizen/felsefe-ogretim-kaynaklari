name: Gecici plan uretimi
on:
  push:
    branches: [ozellik/gunluk-plan-pilot-u1]

permissions:
  contents: write

jobs:
  uret:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ozellik/gunluk-plan-pilot-u1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Plani uret
        run: |
          set +e
          {
            echo "=== uret_plan.py calistiriliyor ==="
            python tools/uret_plan.py 2>&1
            echo "URET_EXIT_CODE=$?"
            echo "=== --check ==="
            python tools/uret_plan.py --check 2>&1
            echo "CHECK_EXIT_CODE=$?"
            echo "=== yapisal kalite ==="
            python tools/denetle_yapisal_kalite.py 2>&1 || true
            echo "=== dosya listesi ==="
            find mufredat -path "*gunluk-planlar*" -name "*.md" | sort
          } | tee uretim-log.txt
      - name: Degisiklikleri commit et
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Degisiklik yok"
          else
            git commit -m "uret_plan: tum haftalik planlari uret"
            git push
          fi
