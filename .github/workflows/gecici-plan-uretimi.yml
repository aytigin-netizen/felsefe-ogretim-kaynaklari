name: Gecici haftalik plan uretimi

on:
  push:
    branches:
      - ozellik/gunluk-plan-pilot-u1

permissions:
  contents: write

jobs:
  uret:
    name: Haftalik planlari uret ve isle
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Planlari uret ve tum denetimleri logla
        run: |
          python tools/uret_plan.py > gunluk-plan-uretim-log.txt 2>&1
          echo "uret_plan exit: $?" >> gunluk-plan-uretim-log.txt
          python tools/uret_plan.py --check >> gunluk-plan-uretim-log.txt 2>&1
          echo "uret_plan --check exit: $?" >> gunluk-plan-uretim-log.txt
          python tools/denetle_yapisal_kalite.py >> gunluk-plan-uretim-log.txt 2>&1
          echo "denetle_yapisal exit: $?" >> gunluk-plan-uretim-log.txt
          python tools/denetle_program_uyumu.py >> gunluk-plan-uretim-log.txt 2>&1
          echo "denetle_program exit: $?" >> gunluk-plan-uretim-log.txt
          python tools/uret_site.py --check >> gunluk-plan-uretim-log.txt 2>&1
          echo "uret_site --check exit: $?" >> gunluk-plan-uretim-log.txt

      - name: Degisiklikleri isle ve gonder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "uret_plan: 10. sinif unite 1 haftalik planlarini uret"
          git push
