name: Gecici plan yerlesimi
on:
  push:
    branches: [duzeltme/plan-konumu]

permissions:
  contents: write

jobs:
  uret:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: duzeltme/plan-konumu
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Yamayi uygula ve siteyi uret
        run: |
          set +e
          {
            python tools/gecici_plan_konum.py 2>&1
            echo "PATCH_EXIT=$?"
            python tools/uret_site.py 2>&1
            echo "SITE_EXIT=$?"
            python tools/uret_site.py --check 2>&1
            echo "SITE_CHECK_EXIT=$?"
            python tools/uret_plan.py --check 2>&1
            echo "PLAN_CHECK_EXIT=$?"
            python tools/denetle_yapisal_kalite.py 2>&1
            echo "KALITE_EXIT=$?"
            echo "=== plan grup sayisi (index) ==="
            grep -o "plan-grup" docs/index.html | wc -l
            echo "=== bolum sirasi ==="
            grep -n "<h2>" docs/index.html | head -20
          } | tee konum-log.txt
      - name: Commit et
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --quiet tools/gecici_plan_konum.py || true
          git add -A
          if git diff --cached --quiet; then
            echo "Degisiklik yok"
          else
            git commit -m "uret_site: haftalik planlari unitelerin yanina katlanir gruplarla tasi"
            git push
          fi
