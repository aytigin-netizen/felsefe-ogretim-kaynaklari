name: Dalda siteyi üret ve denetle

on:
  push:
    branches:
      - ozellik/erisilebilirlik

permissions:
  contents: write

jobs:
  uret:
    name: Statik siteyi yeniden üret ve denetimleri çalıştır
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Statik siteyi yeniden üret
        run: python tools/uret_site.py

      - name: Yapısal kalite denetimini çalıştır
        run: python tools/denetle_yapisal_kalite.py

      - name: Resmî program uyumunu denetle
        run: python tools/denetle_program_uyumu.py

      - name: Üretimin depodaki sayfalarla birebir uyuştuğunu doğrula
        run: python tools/uret_site.py --check

      - name: Üretilen sayfaları dala işle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "Üretim güncel; işlenecek değişiklik yok."
          else
            git commit -m "docs: statik siteyi yeni özelliklerle yeniden üret [skip ci]"
            git push
          fi
