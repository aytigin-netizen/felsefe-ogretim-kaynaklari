name: Gecici site yeniden uretimi

on:
  push:
    branches:
      - ozellik/geri-bildirim-dugmesi

permissions:
  contents: write

jobs:
  uret:
    name: Statik siteyi yeniden uret ve isle
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Siteyi yeniden uret
        run: python tools/uret_site.py

      - name: Uretim denetimini dogrula
        run: python tools/uret_site.py --check

      - name: Degisiklikleri isle ve gonder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "uret_site: geri bildirim dugmesi ile sayfalari yeniden uret"
          git push
